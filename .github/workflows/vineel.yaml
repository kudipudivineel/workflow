name: workflow
on: workflow_dispatch:
inputs:
  description: "select environment"
  required: true
  type: choice
  options:
    - dev
    - prod
    - test
  jobs:
    job:
    runs-on: ubuntu-latest
    steps:
      - name: print a file
        run: echo "hi welcome"
    build:
    runs-on: ubuntu-latest
    needs: job
    steps:
      - name: print a name
        run: echo "$NAME"
