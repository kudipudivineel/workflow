name: workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - prod
          - test

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Print a file
        run: echo "Hi welcome"

  build:
    runs-on: ubuntu-latest
    needs: job
    steps:
      - name: Print environment
        run: | 
          echo "Environment is ${{ inputs.environment }}"
          echo "${{github.ref}}"
  check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: print git
        uses: actions/checkout@v4
      
       
    
